# OWASP ASVS V14 - Hardening de Cabeçalhos e Proteção Nginx
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Bloquear acesso a arquivos ocultos (.git, .env, etc.)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Bloquear acesso a arquivos sensíveis de banco de dados ou logs
location ~* \.(sqlite|sqlite3|db|wal|shm|log|bak|sql|env)$ {
    deny all;
    access_log off;
    log_not_found off;
}
