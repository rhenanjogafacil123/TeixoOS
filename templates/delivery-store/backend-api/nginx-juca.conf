# Configuração de Proxy Reverso Nginx para Pizza do Juca
# Adicionar dentro do bloco "server { ... }" do arquivo /etc/nginx/sites-available/default
# ou /etc/nginx/conf.d/default.conf

# 1. Rota de API (redireciona para o Node.js na porta 3001)
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;
}

# 2. Rota estática do site e painel
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
}
